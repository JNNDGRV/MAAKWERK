<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - MAAKWERK</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header with Navigation -->
    <header>
        <nav class="navbar">
            <h1 class="logo">MAAKWERK</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="over-ons.html">Over ons</a></li>
                <li><a href="realisaties.html">Realisaties</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="content-section">
            <h2>Contact</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Naam</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Bericht</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Versturen</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Contact</h3>
                <p>Email: <a href="mailto:info@maakwerk.nl">info@maakwerk.nl</a></p>
                <p>Telefoon: <a href="tel:+31612345678">+31 6 12345678</a></p>
            </div>
            <div class="footer-section">
                <h3>Volg ons</h3>
                <ul class="social-links">
                    <li><a href="https://facebook.com/maakwerk" target="_blank">Facebook</a></li>
                    <li><a href="https://instagram.com/maakwerk" target="_blank">Instagram</a></li>
                    <li><a href="https://linkedin.com/company/maakwerk" target="_blank">LinkedIn</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 MAAKWERK. Alle rechten voorbehouden.</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
